# CityCare Hospital Management System - Server Configuration
server.port=8080

# Application Name
spring.application.name=hospital-backend

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/hospital_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Servlet Session Cookie Configuration (Local Dev: HttpOnly = true, SameSite = Lax)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Prevent stack trace leakage in HTTP responses
server.error.include-stacktrace=never
server.error.include-message=always
